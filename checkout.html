<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Checkout | Snacks</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <nav class="navbar">
    <div class="logo">Snacks.</div>
    <div class="nav-links">
      <a href="index.html">Home</a>
      <a href="products.html">Products</a>
      <a href="cart.html">Cart <span id="cart-count">0</span></a>
    </div>
  </nav>

  <div class="form-container" style="max-width: 600px;">
    <h2 class="form-title">Checkout Summary</h2>
    
    <div style="background: #f8fafc; padding: 1.5rem; border-radius: 10px; margin-bottom: 2rem;">
      <h3 style="margin-bottom: 1rem; font-size: 1.2rem;">Order Details</h3>
      <div id="checkout-items"></div>
      <hr style="margin: 1rem 0; border: none; border-top: 1px solid var(--border-color);">
      <h3 style="display: flex; justify-content: space-between;">
        <span>Total Amount:</span>
        <span style="color: var(--primary-color);">₹<span id="checkout-total">0</span></span>
      </h3>
    </div>

    <button id="pay-btn" class="btn" style="width: 100%; font-size: 1.2rem; padding: 1rem;">Pay with Razorpay</button>
    <div id="payment-status" style="margin-top: 1rem; text-align: center; font-weight: bold;"></div>
  </div>

  <script src="https://checkout.razorpay.com/v1/checkout.js"></script>
  <script src="js/app.js"></script>
  <script src="js/payment.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      // Check if logged in
      const userInfo = localStorage.getItem('userInfo');
      if (!userInfo) {
        window.location.href = 'login.html';
        return;
      }
      
      const cart = JSON.parse(localStorage.getItem('cart') || '[]');
      if (cart.length === 0) {
        window.location.href = 'cart.html';
        return;
      }

      let total = 0;
      const checkoutItems = document.getElementById('checkout-items');
      
      cart.forEach(item => {
        total += item.price * item.quantity;
        checkoutItems.innerHTML += `
          <div style="display: flex; justify-content: space-between; margin-bottom: 0.5rem;">
            <span>${item.name} x ${item.quantity}</span>
            <span>₹${item.price * item.quantity}</span>
          </div>
        `;
      });

      document.getElementById('checkout-total').textContent = total;
    });
  </script>
</body>
</html>

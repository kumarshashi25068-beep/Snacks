<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cart | Snacks</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
  <nav class="navbar">
    <div class="logo">Snacks.</div>
    <div class="nav-links">
      <a href="index.html">Home</a>
      <a href="products.html">Products</a>
      <a href="cart.html" class="nav-icon" style="color: var(--primary-color);">
        <i class="fas fa-shopping-cart"></i>
        <span id="cart-count">0</span>
      </a>
      <a href="login.html" id="auth-link">Login</a>
    </div>
  </nav>

  <div class="cart-container">
    <h2 class="section-title" style="margin-top: 0; text-align: left;">Your Cart</h2>
    
    <div id="cart-items-container">
      <table class="cart-table">
        <thead>
          <tr>
            <th>Product</th>
            <th>Price</th>
            <th>Quantity</th>
            <th>Total</th>
            <th>Action</th>
          </tr>
        </thead>
        <tbody id="cart-table-body">
          <!-- Cart items loaded here -->
        </tbody>
      </table>
    </div>

    <div class="cart-summary" id="cart-summary" style="display: none;">
      <h3>Cart Total: ₹<span id="cart-total-price">0</span></h3>
      <button class="btn" onclick="proceedToCheckout()" style="margin-top: 1rem; width: 100%;">Proceed to Checkout</button>
    </div>
    
    <div id="empty-cart-msg" style="text-align: center; padding: 4rem 0; display: none;">
      <h3>Your cart is empty</h3>
      <br>
      <a href="products.html" class="btn">Continue Shopping</a>
    </div>
  </div>

  <script src="js/app.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      renderCartPage();
    });
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Products | Snacks</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
  <nav class="navbar">
    <div class="logo">Snacks.</div>
    <div class="nav-links">
      <a href="index.html">Home</a>
      <a href="products.html" style="color: var(--primary-color);">Products</a>
      <a href="cart.html" class="nav-icon">
        <i class="fas fa-shopping-cart"></i>
        <span id="cart-count">0</span>
      </a>
      <a href="login.html" id="auth-link">Login</a>
    </div>
  </nav>

  <h2 class="section-title">Our Collection</h2>
  
  <div class="product-grid" id="products-container">
    <!-- Products will be loaded here dynamically -->
    <div style="text-align: center; width: 100%; grid-column: 1 / -1;">
      Loading products...
    </div>
  </div>

  <script src="js/app.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      fetchProducts();
    });
  </script>
</body>
</html>
